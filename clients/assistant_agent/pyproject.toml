# 构建系统配置
# PEP 517 规定的构建系统配置，指定构建工具和后端
[build-system]
# 构建时需要的依赖
requires = ["setuptools>=73.0.0", "wheel"]
# 构建后端，使用 setuptools
build-backend = "setuptools.build_meta"

# 项目元数据配置
# PEP 621 规定的项目核心元数据
[project]
# 项目名称，将用于发布和安装
name = "assistant-agent"
# 项目版本，1.0.0 以上版本被视为正式发布版本
# 修改版本号时请遵循：https://ku.baidu-int.com/knowledge/HFVrC7hq1Q/tjIp17bwPd/CHf1I_vIs4/9lX58wB6nSUjI_
version = "0.1.0"
# 项目简介，不支持非英文字符
description = "Assistant Agent with LangGraph and MCP integration"
# README 文件路径，用于生成长描述
readme = "README.md"
# Python 版本要求
requires-python = ">=3.11"
# 许可证信息
license = { text = "MIT" }
# 作者信息列表
authors = [
    { name = "gaochenxi", email = "gaochenxi@baidu.com" }
]
# 关键词，用于包索引和搜索
keywords = ["baidu", "demo"]
# 项目分类，用于 PyPI 分类（如果项目不打算开源可以忽略）
# 完整分类列表：https://pypi.org/pypi?%3Aaction=list_classifiers
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11"
]
# 项目依赖列表
dependencies = [
    "langgraph>=0.6.5",
    "langgraph-prebuilt>=0.6.4",
    "langchain>=0.3.26",
    "langchain-core>=0.3.69",
    "langchain-openai>=0.3.23",
    "langchain-anthropic>=0.3.17",
    "langchain-community>=0.3.27",
    "langchain-tavily>=0.2.10",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-text-splitters>=0.3.8",
    "langmem>=0.0.29",
    "langsmith>=0.4.8",
    "pydantic>=2.0.0",
    "rich>=14.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.20.0",
    "tavily-python>=0.5.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

# 可选依赖配置，可通过 pip install package[dev] 安装
[project.optional-dependencies]
# 开发相关依赖
dev = [
    "mypy>=1.11.1", 
    "ruff>=0.6.1",
    "pytest",
    "mock"
]

# 项目相关 URL 配置
[project.urls]
# 项目主页，通常是项目的 icode 地址
Homepage = "http://icode.baidu.com/repos/baidu/personal-code/assistant-agent/tree/master"
# 更新日志文件链接
Changelog = "CHANGELOG.md"

# 命令行入口点配置
[project.scripts]
# 格式：命令名 = 模块路径:函数名
assistant-agent = "assistant_agent.cmdline:main"

# setuptools 构建工具配置
[tool.setuptools]
# 要包含的 Python 包
packages = ["assistant_agent"]

# 包目录配置
[tool.setuptools.package-dir]
"assistant_agent" = "assistant_agent"

# 包数据配置
[tool.setuptools.package-data]
"*" = ["py.typed"]

# Ruff 代码检查和格式化工具配置
[tool.ruff]
# 启用的检查规则
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
# 忽略的检查规则
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

# 按文件忽略规则
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

# pydocstyle 配置
[tool.ruff.lint.pydocstyle]
convention = "google"
